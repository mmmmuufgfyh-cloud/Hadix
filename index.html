<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HADIX Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent; /* مهم برای overlay */
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* کانتینر */
.container {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* متن HADIX */
.logo {
  font-size: 96px;
  font-weight: 700;
  color: #FFD700; /* زرد */
  letter-spacing: 8px;
  text-shadow:
    0 0 5px #FFD700,
    0 0 10px #FFD700,
    0 0 20px #FFD700,
    0 0 40px #FFD700;
  animation: neonPulse 1.8s ease-in-out infinite alternate;
  z-index: 2;
}

/* خط زرد پایینی */
.glow-line {
  position: absolute;
  bottom: 10%; /* دقیقاً پایین متن */
  left: 0;
  width: 100%; /* از چپ تا راست صفحه */
  height: 4px;
  background: linear-gradient(90deg, #FFD700 0%, #FFFF33 50%, #FFD700 100%);
  box-shadow: 0 0 15px #FFD700, 0 0 30px #FFFF33;
  animation: lineMove 2s linear infinite;
}

/* انیمیشن متن */
@keyframes neonPulse {
  0% { opacity: 0.6; text-shadow: 0 0 5px #FFD700, 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 40px #FFD700; }
  50% { opacity: 1; text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 40px #FFD700, 0 0 80px #FFD700; }
  100% { opacity: 0.6; text-shadow: 0 0 5px #FFD700, 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 40px #FFD700; }
}

/* حرکت نور روی خط */
@keyframes lineMove {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.glow-line {
  background-size: 200% 100%;
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">HADIX</div>
  <div class="glow-line"></div>
</div>
</body>
</html>
