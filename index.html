<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HADIX Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent; /* بک‌گراند شفاف */
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* کانتینر */
.container {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* متن HADIX فقط زرد ساده و حرکت چپ و راست */
.logo {
  font-size: 96px;
  font-weight: 700;
  color: #FFD700; /* زرد ساده */
  letter-spacing: 8px;
  position: relative;
  animation: moveX 3s ease-in-out infinite alternate;
  z-index: 2;
}

/* خط زرد پایینی با هایلایت */
.glow-line {
  position: absolute;
  bottom: 10%;
  left: 0;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, #FFD700 0%, #FFFF33 50%, #FFD700 100%);
  box-shadow: 0 0 20px #FFD700, 0 0 40px #FFFF33, 0 0 60px #FFD700;
  border-radius: 2px;
  animation: lineMove 2s linear infinite;
  background-size: 200% 100%;
}

/* حرکت متن HADIX چپ و راست */
@keyframes moveX {
  0% { transform: translateX(-30px); }
  50% { transform: translateX(30px); }
  100% { transform: translateX(-30px); }
}

/* حرکت نور روی خط */
@keyframes lineMove {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
