<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HADIX Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* کانتینر */
.container {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* متن اصلی HADIX با حرکت شناور کم و هایلایت خیلی کم */
.logo {
  font-size: 96px;
  font-weight: 700;
  color: #FFD700; /* زرد */
  letter-spacing: 8px;
  position: relative;
  animation: floatText 3s ease-in-out infinite alternate;
  z-index: 2;
  text-shadow: 0 0 5px rgba(255, 215, 0, 0.3); /* هایلایت خیلی کم */
  display: inline-block;
}

/* خط زرد پایین به اندازه متن و شناور کم */
.glow-line {
  position: absolute;
  bottom: -10px; /* کمی پایین‌تر از متن */
  height: 4px;
  background: linear-gradient(90deg, #FFD700 0%, #FFFF33 50%, #FFD700 100%);
  box-shadow: 0 0 20px #FFD700, 0 0 40px #FFFF33, 0 0 60px #FFD700;
  border-radius: 2px;
  animation: floatLine 3s ease-in-out infinite alternate, lineMove 2s linear infinite;
  background-size: 200% 100%;
  z-index: 1;
}

/* حرکت شناور متن */
@keyframes floatText {
  0% { transform: translateX(-10px) translateY(0px); }
  50% { transform: translateX(10px) translateY(-5px); }
  100% { transform: translateX(-10px) translateY(0px); }
}

/* حرکت شناور خط */
@keyframes floatLine {
  0% { transform: translateX(-10px) translateY(0px); }
  50% { transform: translateX(10px) translateY(-5px); }
  100% { transform: translateX(-10px) translateY(0px); }
}

/* حرکت نور روی خط */
@keyframes lineMove {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
</style>
</head>
<body>
<div class="container">
  <div class="logo" id="main-text">HADIX</div>  <!-- متن اصلی -->
  <div class="glow-line" id="line"></div> <!-- خط پایین -->
</div>

<script>
// تنظیم عرض خط به اندازه متن
const text = document.getElementById('main-text');
const line = document.getElementById('line');

function updateLineWidth() {
  const textWidth = text.offsetWidth;
  line.style.width = textWidth + 'px';
}
updateLineWidth();

// بروزرسانی هنگام Resize صفحه
window.addEventListener('resize', updateLineWidth);
</script>
</body>
</html>
