<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HADIX Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* بک‌گراند شفاف */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: transparent; /* مهم برای overlay */
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* کانتینر */
.container {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* متن HADIX */
.logo {
  font-size: 96px;
  font-weight: 700;
  color: #FFD700; /* زرد */
  letter-spacing: 8px;
  text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700;
  animation: glow 2s ease-in-out infinite alternate;
  z-index: 2;
}

/* خط نور زرد زیر متن */
.glow-line {
  width: 60%;
  height: 4px;
  background: #FFD700;
  box-shadow: 0 0 15px #FFD700, 0 0 30px #FFD700;
  margin-top: 10px;
  border-radius: 2px;
  animation: lineGlow 2s ease-in-out infinite alternate;
  z-index: 1;
}

/* انیمیشن متن */
@keyframes glow {
  0% { opacity: 0.6; transform: scale(0.98); }
  50% { opacity: 1; transform: scale(1.02); }
  100% { opacity: 0.6; transform: scale(0.98); }
}

/* انیمیشن خط */
@keyframes lineGlow {
  0% { opacity: 0.4; transform: scaleX(0.95); }
  50% { opacity: 1; transform: scaleX(1.05); }
  100% { opacity: 0.4; transform: scaleX(0.95); }
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">HADIX</div>
  <div class="glow-line"></div>
</div>
</body>
</html>
